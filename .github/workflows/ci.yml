name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run test:integration
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/chatapp_test
          JWT_SECRET: ci-only-test-secret
      - run: npm run lint
      - name: Start server for performance smoke
        run: |
          node src/server.js > /tmp/chat-app.log 2>&1 &
          echo $! > /tmp/chat-app.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chat-app.log
          exit 1
        env:
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/chatapp_perf_test
          JWT_SECRET: ci-performance-only-secret
      - name: Run 100-client performance smoke
        run: npm run perf:smoke
        env:
          BASE_URL: http://127.0.0.1:3000
          PERF_LATENCY_TARGET_MS: 500
      - name: Stop performance smoke server
        if: always()
        run: |
          if [ -f /tmp/chat-app.pid ]; then
            kill "$(cat /tmp/chat-app.pid)" 2>/dev/null || true
          fi
